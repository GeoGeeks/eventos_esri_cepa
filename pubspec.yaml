name: esri_eventos
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  dropdown_button2: ^2.3.9
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.0

  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  share_plus: ^11.0.0

  # Formulario de registro: registroeventos.esri.co es una SPA que se pinta con
  # JavaScript, así que se muestra dentro de la app en un WebView.
  webview_flutter: ^4.13.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Falso de UrlLauncherPlatform en test/valoracion_encuesta_test.dart (no hay
  # canal de plataforma real bajo `flutter test`).
  url_launcher_platform_interface: ^2.3.2

  # Genera los íconos de lanzador (Android) y de app (iOS) a partir de una
  # sola imagen fuente. Falta colocar el PNG de marca en assets/icon/icon.png
  # (cuadrado, 1024x1024, sin transparencia recomendable para Android) y
  # correr: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

  # Genera la pantalla de splash nativa (Android + iOS) a partir de una config
  # declarativa, sin tocar Xcode a mano. Reutiliza el mismo ícono de marca
  # (assets/icon/icon.png) centrado sobre el azul primario de la app. Correr:
  # dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.4
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#007AC2"
  image: assets/icon/icon.png
  android_12:
    color: "#007AC2"
    image: assets/icon/icon.png
  # Ajustar si el splash real de Figma usa el fondo degradado azul oscuro de
  # LoginScreen (FondoInicio) en vez de un color plano - ver CLAUDE.md.
  # Cambiar `color` por el hex exacto, o `background_image` por un asset
  # propio, si diseño confirma que el splash no es azul plano.

flutter:
  uses-material-design: true

  assets:
      - assets/icons/
      - assets/images/cards/
      - assets/images/inicio/
      - assets/images/login/
      - assets/images/invitados/
      - assets/images/onboarding/
      - assets/images/profile/
      - assets/images/experiencias/
      - assets/images/post_evento/
      - assets/images/notificaciones/
      

  fonts:
    - family: AvenirNextUltraLight
      fonts:
        - asset: assets/fonts/AvenirNextLTPro-UltLt.ttf

    - family: AvenirNextThin
      fonts:
        - asset: assets/fonts/AvenirNextLTPro-Thin.ttf

    - family: AvenirNextLight
      fonts:
        - asset: assets/fonts/AvenirNextLTPro-Light.otf

    - family: AvenirNextRegular
      fonts:
        - asset: assets/fonts/AvenirNextLTPro-Regular.ttf

    - family: AvenirNextMedium
      fonts:
        - asset: assets/fonts/AvenirNextLTPro-Medium.ttf

    - family: AvenirNextDemi
      fonts:
        - asset: assets/fonts/AvenirNextLTPro-Demi.ttf

    - family: AvenirNextBold
      fonts:
        - asset: assets/fonts/AvenirNextLTPro-Bold.ttf
